# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  # The bump PRs are opened with the owner's own token, and GitHub never notifies
  # anyone of their own actions, so a green bump PR would sit unnoticed. This
  # comment comes from github-actions[bot], so the mention reaches the owner.
  notify:
    needs: test-bot
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'bump-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Tell the owner the PR is ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(gh pr diff "$PR" --name-only)"
          if grep -q '^Formula/' <<<"$files"; then
            # Merging with the button publishes no bottles: brew pr-pull merges
            # the PR itself and adds the bottle block.
            nl=$'\n'
            fence="\`\`\`"
            body="@$OWNER Bottles are built. Publish them with \`brew pr-pull\`, which also merges this PR, so do not press Merge:${nl}${nl}${fence}${nl}gh workflow run publish.yml -R $GH_REPO -f pull_request=$PR -f head_sha=$HEAD_SHA${nl}${fence}"
          elif grep -q '^Casks/' <<<"$files"; then
            body="@$OWNER Checks passed. No formula changed, so there are no bottles to publish: merge this PR."
          else
            echo "No formula or cask changed: not a package bump, nothing to say"
            exit 0
          fi
          gh pr comment "$PR" --body "$body"

# brew tap-new uses this file to generate a bottle publish workflow for the new tap
name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)
      already_merged:
        description: The PR is already merged (with the button); only publish its bottles
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Pull bottles
        id: pull_bottles
        if: ${{ !inputs.already_merged }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" \
              "$PULL_REQUEST"
          else
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      # A PR merged with the button has its commits on main but no bottles.
      # pr-pull cannot recover it: cherry-picking fails, and --no-cherry-pick
      # diffs main against itself (so it finds no formula to bottle) and amends
      # main's own tip. Instead, do what pr-pull does after its cherry-pick:
      # fetch the PR's test-bot bottles and hand them to pr-upload, which
      # commits the bottle block on main and uploads the bottles.
      - name: Publish the bottles of a merged PR
        id: upload_merged
        if: ${{ inputs.already_merged }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ "$(gh pr view "$PULL_REQUEST" --json state -q .state)" != MERGED ]]
          then
            echo "::error::#$PULL_REQUEST is not merged; publish it without already_merged"
            exit 1
          fi
          head_sha="${HEAD_SHA:-$(gh pr view "$PULL_REQUEST" --json headRefOid -q .headRefOid)}"
          run_id="$(gh run list --workflow tests.yml --event pull_request --commit "$head_sha" \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          if [[ -z "$run_id" ]]
          then
            echo "::error::No successful test-bot run for $head_sha"
            exit 1
          fi
          dir="$(mktemp -d)"
          gh run download "$run_id" --pattern 'bottles_*' --dir "$dir/artifacts"
          # pr-upload reads the bottles from the current directory, flat.
          mv "$dir"/artifacts/*/* "$dir"/
          rm -r "$dir/artifacts"
          cd "$dir"
          brew pr-upload --debug
          echo "bottle_path=$dir" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path || steps.upload_merged.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          branch: main
